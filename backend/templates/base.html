<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶叶拼配审评台</title>
  <style>
    body { font-family: "Palatino Linotype", serif; background: #f6f1e7; color: #3f2e22; margin: 0; }
    header { background: #6b3e26; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
    header a { color: #f6e7c1; }
    main { max-width: 960px; margin: 20px auto; }
    table { width: 100%; background: #fffaf3; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #e6d3c0; text-align: left; }
    form { background: #fffaf3; padding: 12px; margin-bottom: 16px; }
    .inline { display: inline; padding: 0; margin: 0; background: none; }
    .inline input { width: 42px; }
    .pass { color: #166534; } .fail { color: #9f1239; }
    .muted { color: #8a7460; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-printed { background: #dcfce7; color: #166534; }
    .badge-queued { background: #fef9c3; color: #854d0e; }
  </style>
</head>
<body>
  <header>
    <strong>茶叶拼配审评台</strong>
    {% if session.user %}
      <a href="{{ url_for('home') }}">审评</a>
      <a href="{{ url_for('queue') }}">出样队列</a>
      <span style="margin-left:auto">{{ session.user }}</span>
      <a href="{{ url_for('logout') }}">退出</a>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    document.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!form.dataset.swap) return;
      event.preventDefault();
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "HX-Request": "true" },
      });
      const html = await res.text();
      if (!res.ok) { alert(html); return; }
      const tpl = document.createElement("template");
      tpl.innerHTML = html.trim();
      const fresh = tpl.content.firstElementChild;
      if (form.dataset.swap === "prepend-rows") {
        document.querySelector("#rows").insertAdjacentElement("afterbegin", fresh);
        form.reset();
      } else if (form.dataset.swap === "replace-row") {
        form.closest("tr").replaceWith(fresh);
      }
    });
  </script>
</body>
</html>
